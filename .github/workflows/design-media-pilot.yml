name: Design media download pilot
on:
  push:
    paths:
      - '.github/workflows/design-media-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-image-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify one public image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media-pilot
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          url = "https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
          request = urllib.request.Request(url, headers={"User-Agent": "DesignMediaRecoveryPilot/1.0"})
          with urllib.request.urlopen(request, timeout=25) as response:
              data = response.read(2000000)
              mime = response.headers.get("Content-Type", "")
              assert response.status == 200
          assert data.startswith(b"\x89PNG\r\n\x1a\n"), "response is not a PNG"
          assert len(data) > 1000, "empty or suspiciously small image"
          output = pathlib.Path("media-pilot/sample.png")
          output.write_bytes(data)
          record = {"source": "public image connectivity test", "mime": mime, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "status": "downloaded_verified"}
          pathlib.Path("media-pilot/manifest.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY
      - name: Upload pilot ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-media-pilot
          path: media-pilot/
          if-no-files-found: error
          retention-days: 7

name: Public Motion Awards media delta
on:
  push:
    paths:
      - '.github/workflows/media-batch-s005.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download 51 verified pending public images only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/media-recovery.py <<'PY'
          import hashlib, json, pathlib, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone
          
          SITE = "S005-motionawards.com"
          SOURCE = "baseline-20261116-1946-u100-part11-sites-S002-awwwards.com_to_S005-motionawards.com_4sites.zip"
          QUEUE_SHA256 = "2b4ad297bfc808e8daa569568562bfabf29620f5776b258027f982ca11a05301"
          EXPECTED_URLS_SHA256 = "33ef0f4fb848473050025eb80e2572d28b7c2d4cb3df3b9055301df51cb94801"
          ROOT = pathlib.Path("media-delta") / SITE
          MEDIA = ROOT / "media"
          MEDIA.mkdir(parents=True, exist_ok=True)
          relpaths = json.loads(r'''["motion_awards_2025_thumbnails/thumb-32-1024x576.jpg","motion_awards_2025_thumbnails/nike-1024x576.jpg","motion_awards_2025_thumbnails/future-sound.jpg","motion_awards_2025_thumbnails/look-1024x576.jpg","motion_awards_2025_thumbnails/69-1-1024x576.jpg","motion_awards_2025_thumbnails/prothons-1024x576.jpg","motion_awards_2025_thumbnails/roots-1024x576.jpg","motion_awards_2025_thumbnails/key-1-1024x576.jpg","motion_awards_2025_thumbnails/perch-lightthumb-1024x576.jpg","motion_awards_2025_thumbnails/future-2-1024x576.jpg","wp-content/uploads/2025/10/Tim-Thompson-Headshottj-e1761934104862.jpg","wp-content/uploads/2016/12/image-768x768.png","wp-content/uploads/2020/03/Justin-Barnes-1-768x768.jpg","wp-content/uploads/2020/07/KendrickReid-768x768.jpg","wp-content/uploads/2016/12/ED_CHEETHAM_SQ_HEADSHOT_25-768x768.jpg","wp-content/uploads/2017/11/judge_william_campbell-768x768.jpg","wp-content/uploads/2024/05/marti-romances-768x768.jpg","wp-content/uploads/2020/05/Clim-768x768.jpg","wp-content/uploads/2020/07/Jonas-Klabin-768x768.jpg","wp-content/uploads/2017/11/headshot3-768x768.jpg","wp-content/uploads/2021/07/Justin-Blyth_2021-2-768x768.jpg","wp-content/uploads/2017/11/Allison-Brownmoore-768x768.jpg","wp-content/uploads/2021/07/GUS_2024-SQ-768x768.jpg","wp-content/uploads/2020/03/Panos-Pagonis-768x768.jpg","wp-content/uploads/2021/07/291A7286-copy-768x768.jpg","wp-content/uploads/2017/03/Kelly-Jung-768x768.jpg","wp-content/uploads/2021/07/impactist_motionawards-768x768.jpg","wp-content/uploads/2023/10/Keng_2020-768x769.jpg","wp-content/uploads/2017/03/Noah-Norman-768x768.jpg","wp-content/uploads/2020/05/Federico-Masini-768x768.jpg","wp-content/uploads/2017/03/dez--768x768.png","wp-content/uploads/2017/11/Ana-Cristina-Lossada-768x768.jpg","wp-content/uploads/2017/11/Andrea-Damiano-768x768.jpg","wp-content/uploads/2017/11/David-Johnston-768x768.jpg","wp-content/uploads/2016/12/judge_theodore_daley-768x768.jpg","wp-content/uploads/2016/12/khoclaire_2025-768x768.jpg","wp-content/uploads/2021/07/Collin-headshot-v2-768x768.jpg","wp-content/uploads/2016/12/Simone-Noronha-768x768.jpg","wp-content/uploads/2017/11/Jesse-Rylander-bw-768x768.jpg","wp-content/uploads/2017/03/BW_ASHAW_01-768x768.jpg","wp-content/uploads/2025/10/FelixSoletic_Headshot_small-768x768.jpg","wp-content/uploads/2023/10/IMG_3317-768x768.jpg","wp-content/uploads/2017/11/judge_amanda_wahlstrom_plantin-768x768.jpg","wp-content/uploads/2023/10/Serkin-768x768.jpg","wp-content/uploads/2023/10/ASSAF-HEAD-SHOOT-SQ-BW-768x768.png","wp-content/uploads/2017/03/judge_carey_smith-768x768.jpg","wp-content/uploads/2023/11/B_W_01-768x768.jpg","wp-content/uploads/2017/11/judge_miguel_rodriguez-768x768.jpg","wp-content/uploads/2016/12/Oliver-Sin-768x768.jpg","wp-content/uploads/2016/12/judge_liz_blazer-768x768.jpg","wp-content/uploads/2024/11/Ideal-768x768.jpg"]''')
          urls = ["https://motionawards.com/" + p for p in relpaths]
          assert len(urls) == 51 and len(set(urls)) == 51, "Unexpected queue size or duplicates"
          assert hashlib.sha256("\n".join(urls).encode()).hexdigest() == EXPECTED_URLS_SHA256, "Queue does not match source snapshot"
          
          ok, remaining, failures = [], [], []
          block_reason = None
          def detected_extension(data):
              if data.startswith(bytes.fromhex("ffd8ff")): return ".jpg"
              if data.startswith(bytes.fromhex("89504e470d0a1a0a")): return ".png"
              if data[:4] == b"RIFF" and data[8:12] == b"WEBP": return ".webp"
              if data[:6] in (b"GIF87a", b"GIF89a"): return ".gif"
              if data[4:12] in (b"ftypavif", b"ftypavis"): return ".avif"
              raise ValueError("unrecognized binary image signature")
          
          for i, url in enumerate(urls, 1):
              if block_reason:
                  remaining.append(url)
                  continue
              parts = urllib.parse.urlsplit(url)
              assert parts.scheme == "https" and parts.hostname == "motionawards.com" and not parts.username and not parts.password
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; DesignMediaPublicPreviewRecovery/1.0)", "Accept":"image/avif,image/webp,image/png,image/jpeg,image/*"})
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      actual = urllib.parse.urlsplit(resp.url)
                      if actual.scheme != "https" or actual.hostname != "motionawards.com":
                          raise ValueError("unexpected redirect outside intended public website")
                      mime = (resp.headers.get("Content-Type") or "").split(";")[0].strip().lower()
                      if not mime.startswith("image/"):
                          block_reason = "nonimage_or_access_gate"
                          raise ValueError("response is not an image: " + mime)
                      body = resp.read(6 * 1024 * 1024 + 1)
                      if len(body) < 100 or len(body) > 6 * 1024 * 1024:
                          raise ValueError("image size outside limit")
                  ext = detected_extension(body)
                  filename = hashlib.sha256(url.encode()).hexdigest()[:24] + ext
                  (MEDIA / filename).write_bytes(body)
                  ok.append({"url":url,"kind":"image","http_status":200,"bytes":len(body),"content_type":mime,"detected_format":ext[1:].upper(),"image_signature_verified":True,"local_file":"media/" + filename,"sha256":hashlib.sha256(body).hexdigest(),"status":"downloaded_verified"})
                  print(f"OK {i}/{len(urls)} {filename} {len(body)}B")
              except urllib.error.HTTPError as e:
                  failures.append({"url":url,"status":e.code,"reason":"http_error"})
                  remaining.append(url)
                  if e.code in (401,403,429,503):
                      block_reason = f"http_{e.code}_stop_site_no_retry"
                  print(f"HTTP {e.code} {i}/{len(urls)}; {'stop site' if block_reason else 'continue'}")
              except Exception as e:
                  failures.append({"url":url,"reason":type(e).__name__,"message":str(e)[:160]})
                  remaining.append(url)
                  print(f"ERROR {i}/{len(urls)} {type(e).__name__}: {str(e)[:120]}")
              time.sleep(0.6)
          
          ROOT.joinpath("media-records.delta.json").write_text(json.dumps(ok,ensure_ascii=False,indent=2),encoding="utf-8")
          ROOT.joinpath("pending-media.remaining-urls.json").write_text(json.dumps(remaining,ensure_ascii=False,indent=2),encoding="utf-8")
          ROOT.joinpath("media-failures.json").write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding="utf-8")
          summary = {"site":SITE, "source_archive":SOURCE, "source_queue_sha256":QUEUE_SHA256,"original_queue_length":len(urls),"downloaded_verified":len(ok),"remaining":len(remaining),"failures":len(failures),"stop_reason":block_reason,"timestamp_utc":datetime.now(timezone.utc).isoformat(),"restore_note":"Supplemental delta only; deduplicate against latest snapshot by exact URL; do not replace prior media-records or pending-media blindly."}
          ROOT.joinpath("media-delta-summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          if len(ok) + len(remaining) != len(urls): raise SystemExit("accounting mismatch")
          print("SUMMARY",json.dumps(summary,ensure_ascii=False))
          
          PY
          python3 /tmp/media-recovery.py
          zip -qr site-delta.zip media-delta/
          sha256sum site-delta.zip > site-delta.zip.sha256
      - name: Preserve ZIP and hash as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-delta-s005-motionawards
          path: |
            site-delta.zip
            site-delta.zip.sha256
          retention-days: 7
          if-no-files-found: error

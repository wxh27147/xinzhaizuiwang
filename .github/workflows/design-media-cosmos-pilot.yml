name: Design media actual queue pilot
on:
  push:
    paths: ['.github/workflows/design-media-cosmos-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cosmos-four-public-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch verified pending media with strict checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delta/S097-cosmos.so/media
          cat > /tmp/pilot.py <<'PY'
          import hashlib,json,pathlib,urllib.request,urllib.error,datetime,time
          site="S097-cosmos.so"
          urls=[
            "https://cdn.cosmos.so/7351d765-cb43-4933-bafd-af52366f87f1?rect=484,0,1760,1760",
            "https://cdn.cosmos.so/44daca21-2f64-4273-93db-819f29c53965?format=webp&w=400",
            "https://cdn.cosmos.so/eb29b7a9-4886-4f09-b3e2-8a920f6c8f43?format=webp&w=400",
            "https://cdn.cosmos.so/4f9ffb4e-092c-479b-88c2-3a7afb3a3907?rect=0%2C12%2C716%2C716&format=webp&w=400"
          ]
          folder=pathlib.Path("delta")/site
          records=[]; pending=[]; blocked=False
          for url in urls:
            if blocked:
              pending.append(url);continue
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; design-resource-preview-archive/1.0)","Accept":"image/avif,image/webp,image/png,image/jpeg,image/*"})
              with urllib.request.urlopen(req,timeout=35) as r:
                mime=r.headers.get("Content-Type","").split(";")[0].strip().lower()
                b=r.read(8*1024*1024+1)
                if not mime.startswith("image/") or len(b)>8*1024*1024 or len(b)<100:
                  raise ValueError("bad mime or length: "+mime)
              if b.startswith(b"RIFF") and b[8:12]==b"WEBP": ext=".webp"
              elif b.startswith(bytes.fromhex("89504e470d0a1a0a")):ext=".png"
              elif b.startswith(bytes.fromhex("ffd8ff")):ext=".jpg"
              elif b[4:12] in (b"ftypavif",b"ftypavis"):ext=".avif"
              else: raise ValueError("unrecognized image signature")
              name=hashlib.sha256(url.encode()).hexdigest()[:24]+ext
              (folder/"media"/name).write_bytes(b)
              records.append({"url":url,"filename":name,"bytes":len(b),"content_type":mime,"sha256":hashlib.sha256(b).hexdigest(),"status":"downloaded_verified"})
              print("OK",name,len(b),mime)
            except urllib.error.HTTPError as e:
              pending.append(url);print("HTTP_ERROR",e.code)
              if e.code in (401,403,404,429): blocked=True
            except Exception as e:
              pending.append(url);print("ERROR",type(e).__name__,str(e)[:150])
          (folder/"media-recovery-records.json").write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding="utf-8")
          (folder/"media-recovery-pending.json").write_text(json.dumps(pending,ensure_ascii=False,indent=2),encoding="utf-8")
          (folder/"media-recovery-summary.json").write_text(json.dumps({"site":site,"input":len(urls),"downloaded":len(records),"remaining":len(pending),"auth_blocked":blocked,"note":"Delta only. Do not overwrite older site pending-media.json; reconcile on restore against latest snapshot."},ensure_ascii=False,indent=2),encoding="utf-8")
          if not records:raise SystemExit("No media downloaded; no claim of completion.")
          PY
          python3 /tmp/pilot.py
      - name: Upload site delta
        uses: actions/upload-artifact@v4
        with:
          name: design-media-cosmos-real-delta
          path: delta/
          retention-days: 7
          if-no-files-found: error
